<style>

@media(max-width:620px){.site{padding:21px 13px 45px}.hero{flex-direction:column;gap:17px}.hero h1{font-size:26px}.hero-actions{width:100%;justify-content:flex-start}.btn{min-height:39px;font-size:12px;padding:9px 11px}.weekbar{align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.weeklabel{flex-wrap:wrap}.weeklabel strong{font-size:15px}.week-hint{display:none}.overview{gap:7px;margin-bottom:12px}.daytab{min-height:108px;border-radius:12px;padding:10px 9px}.daytab.active{padding:9px 8px}.daytop strong{font-size:15px}.dayratio{font-size:11px}.dayratio b{font-size:14px}.cardhead{padding:18px 16px}.day-title{font-size:21px}.table-wrap{padding:5px 10px 14px}thead th,tbody td{padding-left:4px;padding-right:4px}.c-done{width:35px}.c-goal{width:67px}.c-actual{width:89px}.c-diff{width:57px}.tasklabel{font-size:12px}.goal{font-size:11px;white-space:normal}.actual-input{width:51px;height:33px;font-size:13px}.diff{font-size:10px;white-space:normal}.check{width:20px;height:20px}.check:checked:after{left:5px;top:0}.sidecol{grid-template-columns:1fr}.sidecard{padding:18px}.table-tip{padding:0 16px 16px}.weekfoot{align-items:flex-start;flex-direction:column}}

.site{display:none!important}.print-only{display:block!important}.print-page{page-break-after:always;break-after:page;padding:0}.print-page:last-child{page-break-after:auto;break-after:auto}.print-head{border-bottom:2px solid #243c60;padding-bottom:10px;margin-bottom:13px;display:block;position:relative}.print-eyebrow{color:#456da3;font-size:8.5pt;font-weight:800;letter-spacing:1px}.print-head h1{font-size:18pt;line-height:1.25;letter-spacing:-.5pt;margin:4px 0 2px;font-weight:850;white-space:nowrap}.print-date{font-size:10pt;color:#637286;font-weight:700}.print-meta{color:#718092;font-size:9pt;position:absolute;right:0;bottom:9px;white-space:nowrap}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:start}.print-card{border:1px solid #ccd5e2;border-radius:9px;overflow:hidden;break-inside:avoid;page-break-inside:avoid}.print-cardheader{background:#f3f6fa;display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-bottom:1px solid #dce4ed}.print-cardheader strong{font-size:12pt;font-weight:850}.print-cardheader span{font-size:9pt;color:#637286}.print-table{width:100%;table-layout:fixed;border-collapse:collapse}.print-table th{font-size:8pt;color:#6b7b8c;font-weight:700;background:#fbfcfd;padding:6px 4px;border-bottom:1px solid #e5eaf0;text-align:center}.print-table th:nth-child(2){text-align:left}.print-table td{font-size:9pt;padding:6.5px 4px;border-bottom:1px solid #edf0f3;vertical-align:middle}.print-table tr:last-child td{border-bottom:0}.print-table td:first-child{width:22px;text-align:center}.print-table td:nth-child(2){line-height:1.3;word-break:keep-all;font-weight:600}.print-table td:nth-child(3){text-align:center;color:#53657a;white-space:nowrap}.print-table td:nth-child(4){text-align:center;color:#344a60;white-space:nowrap}.print-check{width:13px;height:13px;display:inline-grid;place-items:center;border:1.3px solid #8293a6;border-radius:2px;font-size:9pt;font-weight:800;color:#008579;line-height:1}.print-check.checked{border-color:#008579}.print-note{padding:8px 10px;border-top:1px dashed #d7e1ed;min-height:32px;color:#617488;font-size:8.5pt}.print-rest{text-align:center;padding:22px 10px;color:#587568;font-size:11pt}.print-total{margin-top:14px;padding:11px 12px;border:1px solid #cbd7e5;background:#f8fafc;border-radius:9px}.print-total h3{margin:0 0 6px;font-size:11pt}.print-total p{margin:0;color:#52667d;font-size:9.5pt}.print-reflect{margin-top:11px;border:1px solid #ccd5e2;border-radius:8px;padding:11px 12px}.print-reflect strong{font-size:10pt}.print-lines{border-bottom:1px dashed #aebdce;height:20px}.print-footer{margin-top:10px;text-align:right;font-size:8pt;color:#8593a4}.print-page:last-child .print-footer{display:none}

<body>
<main class="site">
<header class="hero">
  <div><div class="eyebrow">MY STUDY WEEK · 원래 일정 유지 · 시간 수정</div><h1>나의 일주일 공부 플래너 <span aria-hidden="true">✏️</span></h1><p>수매싱연산 중1-1을 40분으로 반영한 원래 일정입니다. 화요일과 일요일은 계획 시간이 길어요.<br>할 일을 완료하면 체크하고 실제 시간을 기록해 보자.</p></div>
  <div class="hero-actions"><button class="btn" id="pdfButton" title="인쇄 화면에서 PDF로 저장을 선택하세요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 16v4h16v-4"/></svg>PDF로 저장</button><button class="btn primary" id="printButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4V9h16v9h-2"/><path d="M6 15h12v6H6z"/><path d="M17 12h1"/></svg>인쇄하기</button></div>
</header>
<div class="weekbar"><div class="weeklabel"><strong id="weekRange">이번 주</strong><div class="week-control"><button class="icon-btn" id="prevWeek" aria-label="이전 주">‹</button><button class="tiny-btn" id="currentWeek">이번 주</button><button class="icon-btn" id="nextWeek" aria-label="다음 주">›</button></div></div><span class="week-hint">월요일부터 일요일까지, 한 주씩 자동 저장</span></div>
<nav class="overview" id="dayTabs" aria-label="요일 선택"></nav>
<div class="workspace">
  <section class="workcard" id="dayView" aria-live="polite"></section>
  <aside class="sidecol"><section class="sidecard" id="dayStats"></section><section class="sidecard"><h3 class="side-title">📝 오늘의 한마디</h3><textarea class="notearea" id="noteInput" placeholder="오늘 잘한 점, 내일 해 볼 일..." aria-label="오늘의 한마디"></textarea><p class="note-hint">자유롭게 적어도 좋아요. 내용은 자동 저장돼요.</p></section></aside>
</div>
<footer class="weekfoot"><span>🔒 기록은 현재 기기의 이 브라우저에 저장됩니다. 다른 기기로 자동 동기화되지 않아요.</span><button class="subtle-btn" id="resetWeek" title="현재 주의 체크와 시간 기록 지우기">↺ 이번 주 기록 초기화</button></footer>
</main>
<section class="print-only" id="printView" aria-label="인쇄용 주간 계획표"></section>
<script>
(function(){'use strict';
  const DAYS=[
    {name:'월요일',short:'월',items:[['CMS 숙제(목요일분)',90],['토크스테이션 화상영어',25],['토크스테이션 보카수업 & 숙제',35],['영단어 암기',15],['수매싱연산 중1-1',40],['MSC 책읽기',30]]},
    {name:'화요일',short:'화',items:[['쎈연산 6-2',30],['학교수학 개념복습',50],['수매싱연산 중2-1',60],['CMS 2-2 학원 수업',180],['CMS 숙제',90]]},
    {name:'수요일',short:'수',items:[['백점국어 6-2 복습 & 엘리하이',35],['3800제 영문법 (엘리하이)',60],['영어자습서 6-2 복습',60],['수매싱연산 중1-1',40],['영단어 암기',15],['MSC 책읽기',30]]},
    {name:'목요일',short:'목',items:[['쎈연산 6-2',30],['수매싱연산 중2-1',60],['CMS 2-2 학원 수업',180],['MSC 논술 숙제',60]]},
    {name:'금요일',short:'금',items:[['MSC 논술 학원 수업',120],['3800제 영문법 (엘리하이)',60],['토크스테이션 화상영어',25],['토크스테이션 보카수업 & 숙제',35],['수매싱연산 중1-1',40],['영단어 암기',15]]},
    {name:'토요일',short:'토',items:[]},
    {name:'일요일',short:'일',items:[['아이딕북스 1·2',20],['빠작 한자',30],['빠작 문법',30],['한끝사회 6-2 복습 & 사과암기',50],['오투과학 6-2 복습 & 사과암기',50],['CMS 클리닉 + 수매싱 2-1',150],['3800제 영문법 (엘리하이)',60]]}
  ];
  const $=(id)=>document.getElementById(id);
  const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const localISO=(d)=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const monday=(date)=>{const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
  const today=new Date();const todayKey=localISO(today);let selectedWeek=monday(today);let active=(today.getDay()+6)%7;let records={};
  const storageKey=()=>`my-study-plan-v3-corrected:${localISO(selectedWeek)}`;
  function load(){try{const s=localStorage.getItem(storageKey());const v=s?JSON.parse(s):{};records=v&&typeof v==='object'?v:{}}catch(e){records={}}}
  function save(){try{localStorage.setItem(storageKey(),JSON.stringify(records))}catch(e){}}
  const keyOf=(day,item)=>day+'-'+item;
  const rec=(day,item)=>records[keyOf(day,item)]||{};
  const goal=(day)=>DAYS[day].items.reduce((a,x)=>a+x[1],0);
  const hm=(min)=>{const h=Math.floor(min/60),m=min%60;return h?(h+'시간'+(m?' '+m+'분':'')):m+'분'};
  const compact=(min)=>{const h=Math.floor(min/60),m=min%60;return h?(h+'시간'+(m?' '+m+'분':'')):m+'분'};
  const dateAt=(offset)=>{const d=new Date(selectedWeek);d.setDate(d.getDate()+offset);return d};
  const dateRange=()=>{const a=dateAt(0),b=dateAt(6);return `${a.getFullYear()}. ${a.getMonth()+1}. ${a.getDate()} — ${b.getMonth()+1}. ${b.getDate()}`};
  function stat(day){let completed=0,logged=0,actual=0;DAYS[day].items.forEach((_,i)=>{const r=rec(day,i);if(r.done)completed++;if(r.actual!==undefined&&r.actual!==''&&Number.isFinite(+r.actual)){logged++;actual+=+r.actual}});return{completed,logged,actual,total:DAYS[day].items.length,goal:goal(day)}}
  function weekStat(){return DAYS.reduce((a,_,d)=>{const s=stat(d);a.completed+=s.completed;a.total+=s.total;a.actual+=s.actual;a.goal+=s.goal;a.logged+=s.logged;return a},{completed:0,total:0,actual:0,goal:0,logged:0})}
  const pct=(a,b)=>b?Math.round(a/b*100):100;
  function renderTabs(){const html=DAYS.map((d,i)=>{const s=stat(i);const current=localISO(dateAt(i))===todayKey;return `<button class="daytab ${i===active?'active':''} ${current?'today':''}" data-day="${i}" aria-pressed="${i===active}" aria-label="${d.name}, ${s.completed}개 완료"><div class="daytop"><strong>${d.short}</strong><span>${dateAt(i).getMonth()+1}/${dateAt(i).getDate()}</span></div>${s.total?`<div class="dayratio"><b>${s.completed}</b> / ${s.total} 완료</div><div class="daygoal">목표 ${hm(s.goal)}</div><div class="progress"><span style="width:${pct(s.completed,s.total)}%"></span></div>`:`<div class="dayrest">☁️ 쉬는 날</div><div class="progress"><span style="width:100%;background:#9acbbe"></span></div>`}</button>`}).join('');$('dayTabs').innerHTML=html}
  function comparison(r,goal){if(r.actual===undefined||r.actual==='')return `<span class="diff">—</span>`;const diff=Number(r.actual)-goal;return diff===0?`<span class="diff">목표와 동일</span>`:diff<0?`<span class="diff less">${Math.abs(diff)}분 단축</span>`:`<span class="diff more">${diff}분 추가</span>`}
  function renderDay(){const d=DAYS[active],s=stat(active);const date=dateAt(active);const sub=`${date.getMonth()+1}월 ${date.getDate()}일 · 목표 ${hm(s.goal)}`;
    if(!s.total){$('dayView').innerHTML=`<div class="cardhead"><div><h2 class="day-title">${d.name}</h2><div class="day-subtitle">${date.getMonth()+1}월 ${date.getDate()}일 · 재충전의 날</div></div><span class="completion">휴식 DAY</span></div><div class="rest-screen"><div class="rest-emoji">🌿</div><strong>오늘은 쉬어 가는 날!</strong><p>이번 주도 열심히 달려왔어.<br>충분히 쉬고, 좋아하는 일을 즐겨 보자.</p></div>`;return}
    const rows=d.items.map((t,i)=>{const r=rec(active,i);const raw=r.actual!==undefined?r.actual:'';return `<tr><td><input class="check" aria-label="${safe(t[0])} 완료" type="checkbox" data-task="${i}" ${r.done?'checked':''}></td><td><label class="tasklabel ${r.done?'is-done':''}" data-label-task="${i}">${safe(t[0])}</label></td><td><span class="goal">${hm(t[1])}</span></td><td><input class="actual-input" aria-label="${safe(t[0])} 실제 소요 분" data-actual="${i}" type="number" min="0" max="999" step="1" inputmode="numeric" placeholder="0" value="${safe(raw)}"><span class="unit">분</span></td><td class="delta" data-diff="${i}">${comparison(r,t[1])}</td></tr>`}).join('');
    $('dayView').innerHTML=`<div class="cardhead"><div><h2 class="day-title">${d.name}의 할 일</h2><div class="day-subtitle">${sub}</div></div><span class="completion">${s.completed} / ${s.total} 완료</span></div><div class="table-wrap"><table><thead><tr><th class="c-done">완료</th><th>할 일</th><th class="c-goal">목표 시간</th><th class="c-actual">실제 시간</th><th class="c-diff">목표 대비</th></tr></thead><tbody>${rows}</tbody></table></div><p class="table-tip">💡 실제 시간은 분 단위로 입력해. 예) 1시간 10분 → 70 입력</p>`;
    $('dayView').querySelectorAll('[data-label-task]').forEach(el=>el.addEventListener('click',()=>{const cb=$('dayView').querySelector(`[data-task="${el.dataset.labelTask}"]`);cb.click()}));
  }
  function renderStats(){const s=stat(active),w=weekStat(),p=pct(s.completed,s.total);const displayP=s.total?p:100;
    $('dayStats').innerHTML=`<h3 class="side-title">📊 오늘의 기록</h3><div class="circlearea"><div class="donut" style="background:conic-gradient(var(--mint) ${displayP}%,#e9eff4 0)"><div class="donut-core"><b>${s.total?p:100}%</b><span>${s.total?'완료율':'휴식'}</span></div></div><div class="donut-copy"><b>${s.total?s.completed+' / '+s.total+'개':'충전 완료'}</b><span>${s.total?'하나씩 완료해 보자!':'쉬는 것도 중요한 계획!'}</span></div></div><div class="statrow"><span>오늘 목표 시간</span><b>${hm(s.goal)}</b></div><div class="statrow"><span>오늘 실제 기록</span><b>${hm(s.actual)} <span class="minor">(${s.logged}/${s.total}건)</span></b></div><div class="statrow"><span>이번 주 완료</span><b>${w.completed} / ${w.total}개</b></div><div class="statrow"><span>이번 주 목표 총합</span><b>${hm(w.goal)}</b></div>`;
  }
  function printCard(day){const d=DAYS[day],s=stat(day);const rows=d.items.map((t,i)=>{const r=rec(day,i),val=r.actual===undefined||r.actual===''?'______':String(r.actual)+'분';return `<tr><td><span class="print-check ${r.done?'checked':''}">${r.done?'✓':''}</span></td><td>${safe(t[0])}</td><td>${hm(t[1])}</td><td>${safe(val)}</td></tr>`}).join('');const note=records[`note-${day}`]||'';
    return `<div class="print-card"><div class="print-cardheader"><strong>${d.name} <span style="font-size:9pt">${dateAt(day).getMonth()+1}/${dateAt(day).getDate()}</span></strong><span>${s.total?'목표 '+hm(s.goal)+' · '+s.completed+'/'+s.total+' 완료':'휴식'}</span></div>${s.total?`<table class="print-table"><colgroup><col style="width:6%"><col style="width:51%"><col style="width:21%"><col style="width:22%"></colgroup><thead><tr><th>✓</th><th>할 일</th><th>목표</th><th>실제(분)</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="print-rest">☁️ 오늘은 편안히 쉬는 날!</div>`}<div class="print-note">한마디: ${safe(note)||'_________________________________________________'}</div></div>`;
  }
  function renderPrint(){const s=weekStat();const header=(page)=>`<header class="print-head"><div><div class="print-eyebrow">원래 일정 유지 · 시간 수정 · WEEKLY CHECKLIST</div><h1>나의 일주일 공부 플래너</h1><div class="print-date">${dateRange()}</div></div><div class="print-meta">${page} / 2 · 완료 ${s.completed}/${s.total}개</div></header>`;
    $('printView').innerHTML=`<div class="print-page">${header(1)}<div class="print-grid">${[0,1,2,3].map(printCard).join('')}</div><div class="print-footer">체크하고, 실제 걸린 시간도 적어 보자! ✏️</div></div><div class="print-page">${header(2)}<div class="print-grid">${[4,5,6].map(printCard).join('')}</div><section class="print-total"><h3>📌 이번 주 학습 기록</h3><p>계획: ${s.total}개 · 목표 시간 합계: ${hm(s.goal)} · 완료: ${s.completed}개 · 실제 기록: ${hm(s.actual)} (${s.logged}/${s.total}건 입력)</p></section><section class="print-reflect"><strong>🌟 이번 주 내가 잘한 점</strong><div class="print-lines"></div><div class="print-lines"></div></section><div class="print-footer">나는 오늘도 한 걸음 성장했어!</div></div>`;
  }
  function render(){ $('weekRange').textContent=dateRange();renderTabs();renderDay();renderStats();$('noteInput').value=records[`note-${active}`]||'';renderPrint()}
  function shiftWeek(weeks){selectedWeek.setDate(selectedWeek.getDate()+weeks*7);load();active=(weeks===0?(today.getDay()+6)%7:0);render()}
  $('dayTabs').addEventListener('click',e=>{const el=e.target.closest('[data-day]');if(el){active=Number(el.dataset.day);render()}});
  $('dayView').addEventListener('change',e=>{if(e.target.matches('[data-task]')){const i=Number(e.target.dataset.task),k=keyOf(active,i);records[k]={...rec(active,i),done:e.target.checked};save();render()}else if(e.target.matches('[data-actual]')){const i=Number(e.target.dataset.actual);records[keyOf(active,i)]={...rec(active,i),actual:e.target.value};save();render()}});
  $('dayView').addEventListener('input',e=>{if(e.target.matches('[data-actual]')){const i=Number(e.target.dataset.actual);let v=e.target.value;if(v!==''&&(+v<0||+v>999))v=String(Math.min(999,Math.max(0,+v)));records[keyOf(active,i)]={...rec(active,i),actual:v};save();const cell=$('dayView').querySelector(`[data-diff="${i}"]`);if(cell)cell.innerHTML=comparison(rec(active,i),DAYS[active].items[i][1]);renderStats();renderPrint()}});
  $('noteInput').addEventListener('input',e=>{records[`note-${active}`]=e.target.value;save();renderPrint()});
  $('prevWeek').addEventListener('click',()=>shiftWeek(-1));$('nextWeek').addEventListener('click',()=>shiftWeek(1));$('currentWeek').addEventListener('click',()=>{selectedWeek=monday(new Date());active=(new Date().getDay()+6)%7;load();render()});
  function doPrint(){renderPrint();window.print()}
  $('pdfButton').addEventListener('click',()=>{doPrint()});$('printButton').addEventListener('click',doPrint);
  $('resetWeek').addEventListener('click',()=>{if(confirm(`${dateRange()}\n이 주의 체크·시간·메모 기록을 모두 지울까요?`)){records={};save();render()}});
  window.addEventListener('beforeprint',renderPrint);
  load();render();
})();
</script>
</body>
</html>
